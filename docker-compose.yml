# 大众点评情感分析 —— 单机编排
#
# 起服务：
#   docker compose up -d --build
#   docker compose logs -f api
#   docker compose down
#
# 固定模型版本（不写就自动取挂载进来的 models/ 下最新一版）：
#   DS_MODEL_DIR=/app/models/20260917-192434 docker compose up -d
#
# 训练 / 评估（profile 里的服务，不会跟着 up 一起起）：
#   docker compose run --rm train               # 训练
#   docker compose run --rm train generate      # 生成数据
#   docker compose run --rm train evaluate      # 评估
#   产物落在宿主机；切换已加载的模型需要重建 API 容器，不需要重建镜像。

services:
  api:
    build: .
    image: ${DS_IMAGE:-dianping-sentiment:latest}
    container_name: dianping-api
    ports:
      - "${DS_BIND_ADDRESS:-127.0.0.1}:${DS_PORT:-8000}:8000"
    environment:
      DS_HOST: 0.0.0.0
      DS_PORT: "8000"
      DS_DEBUG: "false"
      DS_NUM_THREADS: ${DS_NUM_THREADS:-0}
      DS_LOG_LEVEL: ${DS_LOG_LEVEL:-INFO}
      # 空值保留 config.yaml 的 model_dir；两处都未指定时选最新目录。
      DS_MODEL_DIR: ${DS_MODEL_DIR:-}
    volumes:
      # 权重不进镜像（400MB 且随训练变化），运行时挂进来；只读，容器里改不动
      - ./models:/app/models:ro
      # 配置挂进来，调线程数/批量上限不用重建镜像
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查沿用 Dockerfile 里的 HEALTHCHECK（打 /api/health，不触发推理）

  train:
    profiles: ["train"]
    build: .
    image: ${DS_IMAGE:-dianping-sentiment:latest}
    # Linux 上可设为宿主用户 UID/GID，避免训练产物归 root 所有。
    user: "${DS_TRAIN_UID:-0}:${DS_TRAIN_GID:-0}"
    entrypoint: ["python", "scripts/cli.py"]
    command: ["train"]
    healthcheck:
      disable: true
    environment:
      DS_MODEL_DIR: ${DS_MODEL_DIR:-}
      DS_NUM_THREADS: ${DS_NUM_THREADS:-0}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./bert-base-chinese:/app/bert-base-chinese:ro  # 预训练权重，只读
      - ./data:/app/data                              # 读写：生成的数据要落盘
      - ./runs:/app/runs                              # 训练存档
      - ./models:/app/models                          # 产出模型，服务直接读得到
