[project]
name = "dianping-sentiment"
version = "0.2.0"
description = "大众点评客户评价情感分析（中文评价正负面判别：BERT 微调 + REST API + Web 页面）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5,<2.9",
    "torchvision>=0.23,<0.24",  # 与 torch 2.8.0+cpu 配套；transformers 的 zoedepth 模块无守卫导入它，缺了会报 ModuleNotFoundError
    "transformers>=5.16.1",
    "scikit-learn>=1.6",
    "accelerate>=1.14.0",
    "matplotlib>=3.11.1",
    "pyyaml>=6.0",
    "flask>=3.1",
    "waitress>=3.0",  # 生产用 WSGI 服务器（纯 Python，Windows 可用；gunicorn 不支持 Windows）
]

# 声明包为 src/dianping_sentiment，这样 uv sync 后 import 全局可用
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["dianping_sentiment"]
# 页面模板和静态资源不是 .py，必须显式声明，否则打包后会缺文件
[tool.setuptools.package-data]
dianping_sentiment = ["templates/*.html", "static/*.css", "static/*.js"]

# torch 必须走 PyTorch 官方 CPU 源（这台机器没有 NVIDIA GPU，
# PyPI 上的默认 torch 是 CUDA 版，c10.dll 在无 CUDA 环境会报 WinError 1114）
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
